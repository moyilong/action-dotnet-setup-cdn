name: Install .NET SDK with optional CDN
description: Install one or more .NET SDK versions via the bundled install.sh, optionally using a custom CDN feed.

inputs:
  dotnet-sdk-version:
    description: .NET SDK versions to install, separated by commas, spaces, or newlines (for example 8.0, 9.0.100).
    required: true
  dotnet-cdn:
    description: Optional CDN/feed base URL passed to dotnet-install.sh --azure-feed. Leave empty to use the official feed.
    required: false
    default: ""
  install-dir:
    description: Directory where .NET will be installed. Leave empty to use $HOME/.dotnet.
    required: false
    default: ""
  skip-non-versioned-files:
    description: Whether to pass --skip-non-versioned-files to dotnet-install.sh.
    required: false
    default: "true"

outputs:
  dotnet-root:
    description: The DOTNET_ROOT path configured for following steps.
    value: ${{ steps.install.outputs.dotnet-root }}

runs:
  using: composite
  steps:
    - id: install
      name: Install .NET SDK
      shell: bash
      env:
        DOTNET_CDN: ${{ inputs.dotnet-cdn }}
        DOTNET_SDK_VERSION: ${{ inputs.dotnet-sdk-version }}
        DOTNET_INSTALL_DIR: ${{ inputs.install-dir }}
        SKIP_NON_VERSIONED_FILES: ${{ inputs.skip-non-versioned-files }}
      run: |
        set -euo pipefail

        DOTNET_SDK_VERSION="${DOTNET_SDK_VERSION:?请设置 dotnet-sdk-version}"
        DOTNET_INSTALL_DIR="${DOTNET_INSTALL_DIR:-$HOME/.dotnet}"

        export DOTNET_SDK_VERSION DOTNET_INSTALL_DIR DOTNET_CDN SKIP_NON_VERSIONED_FILES
        bash "${GITHUB_ACTION_PATH}/install.sh"
